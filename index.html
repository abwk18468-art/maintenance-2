<title>حسن صدام للمحاسبة</title>

<style>
:root{--bg:#f2f4f6;--card:#fff;--ink:#0f2a3d;--mute:#6b7c88;--line:#dde3e8;--debt:#b3261e;--pay:#0e7c66;--brass:#b8862b;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media(prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0c1820;--card:#142632;--ink:#e8eef2;--mute:#8da0ad;--line:#25404f;--debt:#ff7b72;--pay:#4cc9a8;--brass:#e0b04f}}
:root[data-theme="dark"]{--bg:#0c1820;--card:#142632;--ink:#e8eef2;--mute:#8da0ad;--line:#25404f;--debt:#ff7b72;--pay:#4cc9a8;--brass:#e0b04f}
*{box-sizing:border-box}html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--ink);font-family:Cairo,Tahoma,sans-serif;font-size:15px}
header{background:var(--ink);color:var(--bg);padding:14px 16px;display:flex;justify-content:space-between;align-items:center}
header b{font-size:19px;font-weight:800}header small{color:var(--brass);display:block;font-size:12px}
main{max-width:720px;margin:0 auto;padding:12px}
.card{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:12px;margin-bottom:10px}
.stats{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.stats .card{margin:0}.stats span{color:var(--mute);font-size:12px}.stats b{display:block;font-size:19px}
.row{display:flex;justify-content:space-between;align-items:center;gap:8px}
.c{cursor:pointer}.nm{font-weight:600}.ph{color:var(--mute);font-size:12px;direction:ltr;text-align:right}
.debt{color:var(--debt);font-weight:800}.pay{color:var(--pay);font-weight:800}
input,select,textarea{width:100%;padding:10px;border:1px solid var(--line);border-radius:8px;background:var(--card);color:var(--ink);font:inherit;margin:4px 0}
button{font:inherit;border:0;border-radius:8px;padding:10px 14px;cursor:pointer;background:var(--ink);color:var(--bg);font-weight:600}
button.g{background:transparent;color:var(--ink);border:1px solid var(--line)}
button.d{background:var(--debt);color:#fff}button.p{background:var(--pay);color:#fff}
button.wa{background:#1f9d55;color:#fff}button.tg{background:#2a8bc9;color:#fff}
.btns{display:flex;gap:8px;flex-wrap:wrap;margin:8px 0}.btns>button{flex:1}
.tabs{display:flex;gap:6px;margin:10px 0}.tabs button{flex:1}
.fab{position:fixed;bottom:calc(16px + env(safe-area-inset-bottom,0px));left:16px;border-radius:50%;width:54px;height:54px;font-size:26px;padding:0;background:var(--brass);color:#fff;box-shadow:0 3px 10px #0004}
.modal{position:fixed;inset:0;background:#000a;display:flex;align-items:flex-end;justify-content:center;z-index:9}
.sheet{background:var(--bg);width:100%;max-width:560px;max-height:92%;overflow:auto;border-radius:16px 16px 0 0;padding:16px;padding-bottom:calc(16px + env(safe-area-inset-bottom,0px))}
.rc{border:2px dashed var(--brass);border-radius:8px;padding:12px;background:var(--card);white-space:pre-wrap;line-height:1.9}
.tag{font-size:11px;padding:2px 8px;border-radius:99px;background:var(--line);color:var(--mute)}
.empty{text-align:center;color:var(--mute);padding:28px 8px}
@media print{header,.btns,.fab,.tabs{display:none}}
@media print{body.th main,body.th header,body.th .fab,body.th .sheet>*:not(#rcp){display:none!important}body.th .modal{position:static;background:none;display:block}body.th .sheet{padding:0;max-width:var(--pw,72mm);overflow:visible}body.th #rcp{width:var(--pw,72mm);font-size:12px;border:0;margin:0}}


/* ===== v2 ===== */
:root{--bg:#eef1f5;--card:#fff;--ink:#0b2239;--mute:#5f7285;--line:#e1e7ee;--debt:#c0362c;--pay:#0f8a6d;--brass:#b8862b;--sh:0 1px 2px #0b22390d,0 8px 20px -10px #0b223333}
@media(prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#08141e;--card:#102535;--ink:#e9eff4;--mute:#8aa0b0;--line:#1d3547;--debt:#ff8277;--pay:#46d1ac;--brass:#e3b45a;--sh:0 1px 2px #0006,0 8px 20px -10px #000a}}
:root[data-theme="dark"]{--bg:#08141e;--card:#102535;--ink:#e9eff4;--mute:#8aa0b0;--line:#1d3547;--debt:#ff8277;--pay:#46d1ac;--brass:#e3b45a;--sh:0 1px 2px #0006,0 8px 20px -10px #000a}
body{padding-bottom:calc(86px + env(safe-area-inset-bottom,0px));font-variant-numeric:tabular-nums;-webkit-tap-highlight-color:transparent}
main{padding:14px 14px 0}
header{background:linear-gradient(135deg,#0b2239,#14456b);color:#fff;padding:12px 16px;position:sticky;top:0;z-index:4;box-shadow:0 6px 18px -8px #0b2239aa}
.brand{display:flex;align-items:center;gap:11px}
.logo{width:40px;height:40px;border-radius:12px;background:linear-gradient(145deg,#d6a444,#a8761f);display:grid;place-items:center;font-weight:800;font-size:20px;color:#fff;box-shadow:0 4px 10px -2px #0006}
header b{font-size:17px;font-weight:800;display:block;line-height:1.2}
header small{color:#b9cddc;font-size:11px;display:block;margin-top:2px}
.sync{display:inline-block;padding:1px 9px;border-radius:99px;background:#ffffff1c;cursor:pointer;color:#e3b45a;font-size:10.5px}
.hi{width:42px;height:42px;min-height:0;padding:0;border-radius:12px;background:#ffffff1a;border:1px solid #ffffff26;color:#fff;display:grid;place-items:center}
.hi svg,#bn svg{width:21px;height:21px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
h3{font-size:16px;font-weight:800;margin:18px 4px 8px}
.card{border-radius:14px;box-shadow:var(--sh);padding:14px}
.c{transition:transform .12s}.c:active{transform:scale(.99)}
.c .row{gap:12px}.nm{font-size:15.5px}
.av{width:44px;height:44px;border-radius:50%;background:linear-gradient(145deg,#0b2239,#14456b);color:#fff;display:grid;place-items:center;font-weight:800;font-size:18px;flex:none}
button{border-radius:12px;min-height:44px;font-weight:600;transition:transform .12s,filter .15s}
button:active{transform:scale(.97)}button:focus-visible{outline:2px solid var(--brass);outline-offset:2px}
input,select,textarea{border-radius:12px;padding:12px;transition:border-color .15s,box-shadow .15s}
input:focus,select:focus,textarea:focus{outline:none;border-color:var(--brass);box-shadow:0 0 0 3px #b8862b30}
.tabs{background:var(--line);padding:4px;border-radius:14px;gap:4px}
.tabs button{border:0;min-height:38px;background:transparent;color:var(--mute)}
.tabs button:not(.g){background:var(--card);color:var(--ink);box-shadow:var(--sh)}
.hero{grid-template-columns:repeat(3,1fr)}.hero .card:not(:first-child){padding:10px}.hero .card:not(:first-child) b{font-size:16px}.sync{margin-top:3px}
.hero .card:first-child{grid-column:1/-1;background:linear-gradient(135deg,#0b2239,#1a5a86);border:0;padding:18px}
.hero .card:first-child span{color:#9fc0d6}.hero .card:first-child b{color:#fff!important;font-size:28px;margin-top:4px}
.tag{padding:3px 10px;font-weight:600}
.empty{border:1.5px dashed var(--line);border-radius:14px;padding:30px 12px;margin:8px 0}
.fab{bottom:calc(78px + env(safe-area-inset-bottom,0px));width:56px;height:56px;background:linear-gradient(145deg,#d6a444,#a8761f);box-shadow:0 10px 22px -6px #a8761faa;z-index:4}
.modal{backdrop-filter:blur(3px)}
.sheet{border-radius:22px 22px 0 0;animation:sup .28s cubic-bezier(.2,.8,.2,1)}
.sheet::before{content:'';display:block;width:42px;height:4px;border-radius:2px;background:var(--line);margin:-6px auto 14px}
@keyframes sup{from{transform:translateY(60px);opacity:0}}
#bn{position:fixed;bottom:0;left:0;right:0;z-index:5;display:flex;background:var(--card);border-top:1px solid var(--line);padding:6px 8px calc(6px + env(safe-area-inset-bottom,0px));box-shadow:0 -8px 22px -12px #0b223355}
#bn button{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;min-height:52px;padding:4px;background:transparent;color:var(--mute);font-size:11px;font-weight:600}
#bn button.on{color:var(--brass);font-weight:800}
@media print{#bn{display:none}}

.chips{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px}.chip{font-size:12px;padding:4px 10px;border-radius:99px;background:var(--line);color:var(--ink)}.chip.hit{background:var(--brass);color:#fff;font-weight:700}
.hi{position:relative}.nb{position:absolute;top:-5px;left:-5px;min-width:18px;height:18px;padding:0 4px;border-radius:9px;background:var(--debt);color:#fff;font:700 11px Cairo,sans-serif;font-style:normal;place-items:center}
.toast{display:none;position:fixed;top:calc(74px + env(safe-area-inset-top,0px));left:12px;right:12px;z-index:6;background:linear-gradient(135deg,#d6a444,#a8761f);color:#fff;padding:12px 14px;border-radius:14px;font-weight:700;box-shadow:0 10px 24px -8px #0008;text-align:center;cursor:pointer}
/* ===== v3: ثيم Circuit + تجاوب لابتوب/هاتف + واجهة دخول جديدة ===== */
:root{--bg:#eef2f7;--card:#fff;--ink:#0b1220;--mute:#5b6b7f;--line:#dde5ee;--debt:#dc2626;--pay:#059669;--brass:#0e7490;--brand:#0e7490;--onb:#fff;--sh:0 1px 2px #0b12200d,0 10px 24px -14px #0b122040}
@media(prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#080d16;--card:#111a2b;--ink:#e6edf7;--mute:#8a9bb2;--line:#1f2b40;--debt:#f87171;--pay:#34d399;--brass:#22d3ee;--brand:#22d3ee;--onb:#04222c;--sh:0 1px 2px #0008,0 10px 24px -14px #000c}}
:root[data-theme="dark"]{--bg:#080d16;--card:#111a2b;--ink:#e6edf7;--mute:#8a9bb2;--line:#1f2b40;--debt:#f87171;--pay:#34d399;--brass:#22d3ee;--brand:#22d3ee;--onb:#04222c;--sh:0 1px 2px #0008,0 10px 24px -14px #000c}
body{font-family:'IBM Plex Sans Arabic',Cairo,Tahoma,sans-serif;background-color:var(--bg);background-image:radial-gradient(color-mix(in srgb,var(--ink) 9%,transparent) 1px,transparent 1px);background-size:24px 24px}
button{background:var(--brand);color:var(--onb)}
.card{border-radius:16px}
header{background:linear-gradient(120deg,#0b1220 0%,#0c3347 55%,#0e7490 135%);padding:12px 18px}
header small{color:#a9bdd3}
.logo{background:linear-gradient(145deg,#22d3ee,#0e7490);color:#04222c;box-shadow:0 6px 14px -4px #0e7490aa}
.sync{background:#ffffff1a;color:#67e8f9}
.av{background:linear-gradient(145deg,#0e7490,#0b1220)}
.hero .card:first-child{background:linear-gradient(135deg,#0b1220,#0e7490)}
.hero .card:first-child span{color:#a5f3fc}
.fab{background:linear-gradient(145deg,#22d3ee,#0e7490);color:#04222c;box-shadow:0 10px 22px -6px #0e7490aa}
.toast{background:linear-gradient(135deg,#0e7490,#0b1220)}
input:focus,select:focus,textarea:focus{border-color:var(--brass);box-shadow:0 0 0 3px color-mix(in srgb,var(--brass) 22%,transparent)}
.hi{background:#ffffff1a;color:#fff}
.sb-brand,.sb-foot{display:none}
/* ---- تابلت وما فوق ---- */
@media(min-width:700px){
  main{max-width:900px;padding:18px 20px 0}
  #lst,#ml,#sl{display:grid;grid-template-columns:1fr 1fr;gap:10px;align-items:start}
  #lst>.card,#ml>.card,#sl>.card{margin-bottom:0}
  #lst>:not(.card),#ml>:not(.card),#sl>:not(.card){grid-column:1/-1}
  .modal{align-items:center;padding:20px}
  .sheet{border-radius:22px;max-width:620px;max-height:88vh;animation:pop .22s cubic-bezier(.2,.8,.2,1)}
  .sheet::before{display:none}
  @keyframes pop{from{transform:scale(.96);opacity:0}}
}
/* ---- لابتوب: شريط جانبي ---- */
@media(min-width:1024px){
  body{padding-right:248px;padding-bottom:28px}
  #bn{top:0;bottom:0;right:0;left:auto;width:248px;flex-direction:column;justify-content:flex-start;gap:4px;padding:20px 14px;background:#0b1220;border-top:0;box-shadow:none}
  #bn .sb-brand{display:flex;align-items:center;gap:12px;color:#fff;padding:4px 8px 22px}
  #bn .sb-brand b{display:block;font-size:17px}#bn .sb-brand small{color:#8fa3bb;font-size:11px}
  #bn button{flex:none;flex-direction:row;justify-content:flex-start;gap:12px;font-size:15px;min-height:46px;padding:0 14px;color:#9fb0c6;border-radius:12px}
  #bn button:hover{background:#ffffff0d;color:#fff}
  #bn button.on{background:#ffffff14;color:#22d3ee;font-weight:700}
  #bn .sb-foot{display:block;margin-top:auto;padding:12px 8px 0;font-size:12px;color:#8fa3bb;border-top:1px solid #ffffff14}#bn .sb-foot b{color:#fff}
  header .brand .logo,header .brand b{display:none}
  main{max-width:1180px;padding:24px 32px 0}
  #lst,#ml,#sl{grid-template-columns:repeat(auto-fill,minmax(340px,1fr))}
  .stats{grid-template-columns:repeat(3,1fr)}
  .hero{grid-template-columns:2fr 1fr 1fr 1fr}.hero .card:first-child{grid-column:auto}
  .fab{left:28px;bottom:28px}
  .toast{right:272px;left:24px}
  .tabs{max-width:560px}
}
@media(max-width:480px){.hi{width:38px;height:38px}header>div:last-child{gap:6px!important}.tabs button{font-size:13px;padding:6px 4px}}
@media(min-width:1024px){.hero .card{display:flex;flex-direction:column;justify-content:center}}
@media print{body{padding-right:0}}



/* ---- واجهة الدخول الأصلية (هاتف + كتاب) ---- */
/* login */
#lg{position:fixed;inset:0;z-index:99;display:flex;overflow:auto;color:#e9eff4;background:radial-gradient(900px 500px at 85% -10%,#c8963e33,transparent 60%),radial-gradient(700px 600px at 10% 110%,#1a5a8655,transparent 60%),linear-gradient(180deg,#0a1c2b,#06121c);transition:opacity .6s,transform .6s;padding:env(safe-area-inset-top,0px) 14px env(safe-area-inset-bottom,0px)}
#lg::before{content:'';position:absolute;inset:0;background-image:radial-gradient(#ffffff14 1px,transparent 1px);background-size:22px 22px;-webkit-mask-image:radial-gradient(circle at 50% 40%,#000,transparent 75%);mask-image:radial-gradient(circle at 50% 40%,#000,transparent 75%);pointer-events:none}
#lg.out{opacity:0;transform:scale(1.05);pointer-events:none}
.lg-in{position:relative;margin:auto;display:flex;flex-direction:column;align-items:center;gap:18px;padding:18px 0;animation:lgup 1s cubic-bezier(.2,.8,.2,1) both}
@keyframes lgup{from{opacity:0;transform:translateY(46px)}}
.lg-phone{width:276px;border-radius:44px;padding:10px;background:linear-gradient(145deg,#3a4a57,#10181f 40%,#27333d);box-shadow:0 40px 80px -20px #000c,0 0 0 1px #ffffff1a;position:relative}
.lg-phone::before{content:'';position:absolute;right:-3px;top:118px;width:3px;height:52px;border-radius:2px;background:#2a3844}
.lg-phone::after{content:'';position:absolute;left:-3px;top:96px;width:3px;height:34px;border-radius:2px;background:#2a3844}
.lg-scr{border-radius:35px;background:radial-gradient(260px 200px at 50% 0,#1f5b87aa,transparent 70%),linear-gradient(180deg,#0f2d46,#081a28);padding:12px 18px 20px;display:flex;flex-direction:column;align-items:center;position:relative;overflow:hidden}
.lg-isl{position:absolute;top:10px;left:50%;margin-left:-32px;width:64px;height:19px;border-radius:12px;background:#000}
.lg-sb{align-self:stretch;display:flex;justify-content:space-between;align-items:center;font-size:11px;font-weight:600;color:#cfe0ec;padding:0 6px;height:22px;direction:ltr}
.lg-bat{display:inline-block;width:18px;height:9px;border:1.5px solid #cfe0ec;border-radius:3px;position:relative;margin-left:6px;vertical-align:middle}
.lg-bat::after{content:'';position:absolute;inset:1px 4px 1px 1px;background:#cfe0ec;border-radius:1px}
.lg-bkw{margin:16px 0 4px;height:98px;width:100%;display:flex;align-items:center;justify-content:center;position:relative;animation:bob 4s ease-in-out infinite alternate}
.lg-bkw::before{content:'';position:absolute;width:160px;height:160px;border-radius:50%;background:radial-gradient(#c8963e55,transparent 65%)}
@keyframes bob{to{transform:translateY(-5px)}}
.lg-t{font-size:24px;font-weight:800;letter-spacing:.3px}.lg-sub{font-size:12px;color:#e3b45a}
.lg-ln{width:34px;height:2px;border-radius:2px;background:#e3b45a;margin:9px 0 10px}
.lg-m{font-size:13.5px;font-weight:700}.lg-s2{font-size:11px;color:#8da6b8;min-height:16px}
.lg-d{display:flex;gap:12px;margin:12px 0 4px;height:14px;align-items:center}
.lg-d i{width:11px;height:11px;border-radius:50%;border:1.5px solid #8da6b8;transition:.15s}
.lg-d i.on{background:#e3b45a;border-color:#e3b45a;transform:scale(1.15)}
.lg-e{min-height:18px;font-size:12px;color:#ff8a80}
.kp{display:grid;grid-template-columns:repeat(3,58px);gap:10px;direction:ltr}
#lg .kp button{width:58px;height:58px;min-height:0;padding:0;border-radius:50%;background:#ffffff12;border:1px solid #ffffff1c;color:#fff;font-size:22px;font-weight:600}
#lg .kp button:active{background:#e3b45a66}
#lg .kp .ke{background:#c8963e;border-color:#c8963e}
#lg .lg-f{background:none;border:0;color:#8da6b8;min-height:0;padding:10px 6px 0;font-size:12px;font-weight:400;text-decoration:underline}
.lg-by{font-size:13px;color:#e3b45a;animation:lgfade 1.6s .9s both}.lg-by b{color:#fff}
@keyframes lgfade{from{opacity:0}}
.shk{animation:shk .4s}@keyframes shk{20%,60%{transform:translateX(-8px)}40%,80%{transform:translateX(8px)}}
.bk{position:relative;width:150px;height:100px;perspective:700px;direction:ltr;transform:scale(.8)}
.bk i{position:absolute;display:block}
.cv{inset:-7px -8px -7px;background:linear-gradient(145deg,#d6a444,#a8761f);border-radius:6px;box-shadow:0 8px 16px #0007}
.pg,.fp{top:0;width:73px;height:100px;background:#fbf7ec repeating-linear-gradient(#fbf7ec 0 11px,#c9d3d8 11px 12px);box-shadow:inset 0 0 8px #0002}
.pgl{left:0;border-radius:3px 0 0 3px}.pgr{right:0;border-radius:0 3px 3px 0}
.fp{left:75px;transform-origin:left center;border-radius:0 3px 3px 0;animation:flp 2.6s ease-in-out infinite alternate}
.f2{animation-delay:.3s}.f3{animation-delay:.6s}
@keyframes flp{0%,10%{transform:rotateY(0)}90%,100%{transform:rotateY(-176deg)}}
@media(prefers-reduced-motion:reduce){.fp,.lg-in,.lg-by,.lg-bkw,.sheet{animation:none}}
.lg-pn{display:flex;flex-direction:column;align-items:center;width:100%}
.spin{width:34px;height:34px;border-radius:50%;border:3px solid #ffffff22;border-top-color:#e3b45a;animation:spn .8s linear infinite;margin:22px 0 10px}
@keyframes spn{to{transform:rotate(360deg)}}
.pa-seg{display:grid;grid-template-columns:1fr 1fr;gap:4px;width:100%;background:#ffffff14;border-radius:10px;padding:3px;margin:8px 0 2px}
#lg .pa-seg button{min-height:32px;background:transparent;color:#b9c8d2;border-radius:8px;font-size:12.5px;font-weight:600;padding:0}
#lg .pa-seg button.on{background:#c8963e;color:#fff}
.pa-in{display:block;width:100%;height:40px;margin:6px 0 0;padding:0 12px;border-radius:10px;background:#ffffff14;border:1px solid #ffffff30;color:#fff;font:inherit;font-size:14px;outline:none}
.pa-in::placeholder{color:#8da6b8}.pa-in:focus{border-color:#e3b45a;box-shadow:0 0 0 3px #e3b45a30}
.pa-pw{position:relative;width:100%}.pa-pw .pa-in{padding-left:38px}

:root[data-theme="dark"] #bn .sb-brand small,:root[data-theme="dark"] #bn .sb-foot{color:#8a8a94}

:root[data-theme="dark"] #bn button.on{background:#ffffff12;color:#22d3ee}
:root[data-theme="dark"] .toast{background:linear-gradient(135deg,#0e7490,#000)}

.tpf{margin:8px 0}.tpv{position:relative;display:block;border-radius:14px;overflow:hidden;background:#000;margin-bottom:6px;cursor:crosshair}.tpv img{display:block;width:100%}

<script>
var __cs=(function(){try{return localStorage.getItem('hs_cur_shop')||''}catch(e){return ''}})(),KEY='hs_acc_v1'+(__cs?'_'+__cs:''),db={cust:[],tx:[],prod:[],seq:0,set:{cur:'د.ع',cc:'964',shop:'حسن صدام',ft:'شكراً لتعاملكم معنا',rate:1500}},st={p:'home',id:null,q:'',f:'all'};
try{var s=localStorage.getItem(KEY);if(s)db=Object.assign(db,JSON.parse(s))}catch(e){}
var $=function(i){return document.getElementById(i)};
function esc(x){return String(x==null?'':x).replace(/[&<>"]/g,function(c){return{'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]})}
function fmt(n,c){return (c==='USD'?'$':'')+Number(n).toLocaleString('en-US',{maximumFractionDigits:2})+(c==='USD'?'':' '+db.set.cur)}
function rate(){return db.set.rate||1500}
function iq(t){return t.amt*(t.cur==='USD'?rate():1)}
function balC(id,c){return db.tx.reduce(function(a,t){return t.cid===id&&(t.cur||'IQD')===c?a+(t.type==='debt'?t.amt:-t.amt):a},0)}
function bal(id){return balC(id,'IQD')+balC(id,'USD')*rate()}
function balS(id){var i=balC(id,'IQD'),u=balC(id,'USD'),p=[];if(i)p.push(fmt(i));if(u)p.push(fmt(u,'USD'));return p.join(' + ')||fmt(0)}
function dt(d){var x=new Date(d);return x.toLocaleDateString('en-GB')+' '+x.toLocaleTimeString('en-GB',{hour:'2-digit',minute:'2-digit'})}
function intl(p){p=String(p||'').replace(/\D/g,'');if(p.indexOf('00')===0)p=p.slice(2);else if(p.charAt(0)==='0')p=db.set.cc+p.slice(1);return p}

function render(){
  var h='';navAct();ntBadge();$('fab').style.display=st.p==='home'?'block':'none';if(st.p==='stock')return stock();if(st.p==='shop')return shop();if(st.p==='rep')return rep();
  if(st.p==='home'){
    var tot=0,n=0,paid=0,gd=0,gp=0;db.tx.forEach(function(t){if(t.ret)return;if(t.type==='debt')gd+=iq(t);else gp+=iq(t)});db.cust.forEach(function(c){var b=bal(c.id);if(b>0){tot+=b;n++}});
    db.tx.forEach(function(t){if(t.type==='pay')paid+=iq(t)});
    h+='<div class="stats hero"><div class="card"><span>المبلغ المتبقي (إجمالي الديون)</span><b class="debt">'+fmt(tot)+'</b></div><div class="card"><span>الدين الكلي</span><b>'+fmt(gd)+'</b></div><div class="card"><span>الواصل كلياً</span><b class="pay">'+fmt(gp)+'</b></div><div class="card"><span>زبائن متأخرون</span><b class="debt">'+db.cust.filter(function(c){return odAmt(c.id)>0}).length+'</b></div></div>';
    h+='<div class="btns"><button class="d" onclick="openDebt()">＋ إضافة دين</button><button class="g" onclick="openCust()">＋ زبون جديد</button></div>';h+='<input id="q" placeholder="ابحث بالاسم أو الرقم" value="'+esc(st.q)+'" oninput="st.q=this.value;list()">';
    h+='<div class="tabs"><button class="'+(st.f==='all'?'':'g')+'" onclick="st.f=\'all\';render()">الكل</button><button class="'+(st.f==='debt'?'':'g')+'" onclick="st.f=\'debt\';render()">عليهم دين</button><button class="'+(st.f==='clear'?'':'g')+'" onclick="st.f=\'clear\';render()">خالصون</button><button class="'+(st.f==='late'?'':'g')+'" onclick="st.f=\'late\';render()">متأخرون</button></div><select onchange="st.so=this.value;list()">'+[['bal','الترتيب: الأكبر ديناً'],['late','المتأخرون أولاً'],['recent','الأحدث حركة'],['name','الاسم']].map(function(o){return '<option value="'+o[0]+'"'+((st.so||'bal')===o[0]?' selected':'')+'>'+o[1]+'</option>'}).join('')+'</select><div id="lst"></div>';
    h+='<div class="btns"><button class="g" onclick="backup()">نسخ احتياطي</button><button class="g" onclick="restore()">استرجاع</button><button class="g" onclick="report()">كشف عام</button></div>';
    $('app').innerHTML=h;list();
  }else{
    var c=db.cust.find(function(x){return x.id===st.id});if(!c){st.p='home';return render()}
    var b=bal(c.id),tx=db.tx.filter(function(t){return t.cid===c.id}).sort(function(a,b){return b.d-a.d});
    h+='<button class="g" onclick="st.p=\'home\';render()">→ رجوع</button>';
    h+='<div class="card" style="margin-top:10px"><div class="row"><div><div class="nm" style="font-size:18px">'+esc(c.name)+'</div><div class="ph">'+esc(c.phone||'بدون رقم')+'</div></div><div style="text-align:left"><span class="tag">الرصيد</span><div class="'+(b>0?'debt':'pay')+'" style="font-size:20px">'+balS(c.id)+'</div></div></div>';
    h+='<div class="btns"><button class="d" onclick="openTx(\''+c.id+'\',\'debt\')">＋ فاتورة دين</button><button class="p" onclick="openTx(\''+c.id+'\',\'pay\')">تسديد</button><button class="g" onclick="quickDebt(\''+c.id+'\')">دين بمبلغ</button></div>';
    h+='<div class="btns"><button class="wa" onclick="stmt(\''+c.id+'\',\'wa\')">كشف حساب واتساب</button><button class="tg" onclick="stmt(\''+c.id+'\',\'tg\')">تيليكرام</button><button class="g" onclick="openCust(\''+c.id+'\')">تعديل</button></div>'+tgCust(c)+(odAmt(c.id)>0?'<button class="d" style="width:100%" onclick="remind(\''+c.id+'\')">تذكير بالمتأخر: '+fmt(odAmt(c.id))+'</button>':'')+(c.lim?'<div class="ph" style="direction:rtl;margin-top:6px">الحد الائتماني: '+fmt(c.lim)+'</div>':'')+'</div>';
    h+=debtCard(c.id);h+=custExtra(c);h+=custHist(c);h+='<h3>الحركات</h3>';
    if(!tx.length)h+='<div class="empty">لا توجد حركات. أضف أول دين من الأعلى.</div>';
    tx.forEach(function(t){h+='<div class="card c" onclick="openReceipt(\''+t.id+'\')"><div class="row"><div><span class="'+(t.type==='debt'?'debt':'pay')+'">'+(t.type==='debt'?'دين ':'تسديد ')+fmt(t.amt,t.cur)+'</span><div class="ph" style="direction:rtl">'+dt(t.d)+(t.note?' — '+esc(t.note):'')+(t.due?' | استحقاق '+new Date(t.due).toLocaleDateString('en-GB'):'')+'</div></div><span class="tag">وصل</span></div></div>'});
    h+='<button class="g" style="width:100%;margin-top:8px;color:var(--debt)" onclick="delCust(\''+c.id+'\')">حذف الزبون</button>';
    $('app').innerHTML=h;
  }
}
function list(){
  var q=st.q.trim().toLowerCase(),out='';
  var a=db.cust.filter(function(c){var b=bal(c.id);if(st.f==='debt'&&b<=0)return false;if(st.f==='clear'&&b>0)return false;if(st.f==='late'&&odAmt(c.id)<=0)return false;return !q||c.name.toLowerCase().indexOf(q)>-1||String(c.phone||'').indexOf(q)>-1}).sort(function(x,y){var o=st.so||'bal';return o==='name'?x.name.localeCompare(y.name):o==='late'?odAmt(y.id)-odAmt(x.id):o==='recent'?lastTx(y.id)-lastTx(x.id):bal(y.id)-bal(x.id)});
  if(!a.length)out='<div class="empty">'+(db.cust.length?'لا نتائج.':'ابدأ بإضافة أول زبون بزر ＋')+'</div>';
  a.forEach(function(c){var b=bal(c.id);out+='<div class="card c" onclick="st.p=\'cust\';st.id=\''+c.id+'\';render()"><div class="row"><div class="av">'+esc(c.name.trim().charAt(0))+'</div><div style="flex:1;min-width:0"><div class="nm">'+esc(c.name)+'</div><div class="ph">'+esc(c.phone||'')+(odAmt(c.id)>0?' <span class="tag" style="background:var(--debt);color:#fff">متأخر</span>':'')+'</div></div><div style="text-align:left"><div class="'+(b>0?'debt':'pay')+'">'+balS(c.id)+'</div><div class="ph" style="direction:rtl;font-size:11px">الكلي '+csum(dtot(c.id).d)+' • الواصل '+csum(dtot(c.id).p)+'</div></div></div></div>'});
  $('lst').innerHTML=out;
}
function modal(h){$('m').innerHTML='<div class="modal" onclick="if(event.target===this)closeM()"><div class="sheet">'+h+'</div></div>'}
function closeM(){$('m').innerHTML=''}
function openCust(id){
  var c=id?db.cust.find(function(x){return x.id===id}):{name:'',phone:''};
  modal('<h3>'+(id?'تعديل زبون':'زبون جديد')+'</h3><input id="cn" placeholder="الاسم" value="'+esc(c.name)+'"><input id="cp" type="tel" placeholder="رقم الهاتف (مثال 0770...)" value="'+esc(c.phone)+'"><input id="cl" type="number" placeholder="الحد الائتماني (اختياري)" value="'+(c.lim||'')+'"><div class="btns"><button onclick="saveCust(\''+(id||'')+'\')">حفظ</button><button class="g" onclick="closeM()">إلغاء</button></div>');
}
function saveCust(id){
  var n=$('cn').value.trim(),p=$('cp').value.trim(),l=parseFloat($('cl').value)||0;if(!n)return $('cn').focus();
  if(id){var c=db.cust.find(function(x){return x.id===id});c.name=n;c.phone=p;c.lim=l}else db.cust.push({id:'c'+Date.now(),name:n,phone:p,lim:l});
  save();closeM();render();
}
function delCust(id){if(!dconf('حذف الزبون وكل حركاته؟'))return;db.cust=db.cust.filter(function(c){return c.id!==id});db.tx=db.tx.filter(function(t){return t.cid!==id});save();st.p='home';render()}
function msg(t){if(t.form==='debt')return debtMsg(t);
  var c=db.cust.find(function(x){return x.id===t.cid}),b=bal(c.id),s=db.set;
  return '🧾 *'+s.shop+'*\n'+(t.type==='debt'?'وصل دين':'وصل تسديد')+' رقم '+(t.no||t.id.slice(-5))+'\n━━━━━━━━\nالزبون: '+c.name+(t.items?'\n'+t.items.map(function(i){return '• '+i.n+' × '+i.q+' = '+fmt(i.q*i.p,t.cur)}).join('\n')+(t.disc?'\nخصم: '+fmt(t.disc,t.cur):''):'')+'\nالمبلغ: '+fmt(t.amt,t.cur)+(t.note?'\nالتفاصيل: '+t.note:'')+'\nالتاريخ: '+dt(t.d)+(t.due?'\nالاستحقاق: '+new Date(t.due).toLocaleDateString('en-GB'):'')+(t.wm?'\nالضمان حتى: '+wend(t).toLocaleDateString('en-GB'):'')+'\n━━━━━━━━\nالرصيد الحالي: '+balS(c.id)+'\n'+s.ft;
}
function openReceipt(id,fresh){
  var t=db.tx.find(function(x){return x.id===id}),c=db.cust.find(function(x){return x.id===t.cid});
  modal('<h3>'+(fresh?'تم الحفظ ✓':'الوصل')+'</h3><div class="rc" id="rcp">'+esc(msg(t).replace(/\*/g,''))+'</div><div class="btns"><button class="wa" onclick="send(\''+id+'\',\'wa\')">واتساب</button><button class="tg" onclick="send(\''+id+'\',\'tg\')">تيليكرام</button></div><div class="btns"><button class="g" onclick="thermal()">طباعة حرارية</button><button class="g" onclick="editTx(\''+id+'\')">تعديل</button>'+(t.items&&!t.ret?'<button class="g" onclick="retTx(\''+id+'\')">مرتجع</button>':'')+'<button class="g" onclick="delTx(\''+id+'\')" style="color:var(--debt)">حذف الحركة</button><button class="g" onclick="closeM()">إغلاق</button></div>'+(c.phone?'':'<p class="ph" style="direction:rtl">لا يوجد رقم لهذا الزبون، سيُطلب منك اختيار جهة الاتصال يدوياً.</p>'));
}

function hm(t){var d=new Date(t);return d.getHours()+':'+String(d.getMinutes()).padStart(2,'0')}
function cj(v){if(Array.isArray(v))return '['+v.map(cj).join(',')+']';if(v&&typeof v==='object')return '{'+Object.keys(v).sort().map(function(k){return JSON.stringify(k)+':'+cj(v[k])}).join(',')+'}';return JSON.stringify(v)}
function cl(v){return JSON.parse(JSON.stringify(v))}

async function push(){
  timer=null;if(!cloud)return;
  if(pushing){needPush=true;return}
  pushing=true;
  try{
    var g=groups(),k;
    for(k in g){var v=cl(g[k]),s=cj(v);if(sent[k]!==s){var old=sent[k];sent[k]=s;try{await cloud.doc(k).set(v)}catch(e){if(old===undefined)delete sent[k];else sent[k]=old;throw e}cdocs[k]=v}}
    for(k in sent){if(!g[k]&&/^(c-|tx-)/.test(k)){await cloud.doc(k).delete();delete sent[k];delete cdocs[k]}}
    lastSync=Date.now();cst('متزامن ✓ '+hm(lastSync));
  }catch(e){cst(e&&e.code==='quota_exceeded'?'امتلأت سعة القاعدة':'تعذرت المزامنة')}
  pushing=false;
  if(needPush){needPush=false;push();return}
  if(needPull){needPull=false;applyRemote()}
}
async function initCloud(){
  if(cloud){return push()}
  try{
    var u=firebase.auth().currentUser;if(!u){authOpen();return}
    cloud=firebase.firestore().collection('users').doc(u.uid).collection('docs');cst('جارٍ المزامنة…');
    var q=await cloud.get();cdocs={};sent={};
    q.docs.forEach(function(s){var v=cl(s.data());cdocs[s.id]=v;sent[s.id]=cj(v)});
    if(q.size){
      var loc=cl(db),m=cdocs.main;fromDocs(cdocs);
      if(m&&(m.ts||0)<(loc.ts||0)){
        CL.concat(['tx']).forEach(function(k){var mp={};(db[k]||[]).forEach(function(r){mp[rid(r)]=r});(loc[k]||[]).forEach(function(r){mp[rid(r)]=r});db[k]=Object.keys(mp).map(function(i){return mp[i]})});
        db.set=loc.set;db.seq=Math.max(db.seq||0,loc.seq||0);db.ts=loc.ts;
      }
      lsave();render();
    }
    await push();listen();
  }catch(e){cloud=null;cst('محلي — تعذر الاتصال')}
}

function imgField(cur){return '<div class="row" style="gap:10px;margin:6px 0"><img id="imgp" src="'+(cur||'')+'" style="width:64px;height:64px;object-fit:cover;border-radius:12px;background:var(--line);'+(cur?'':'visibility:hidden')+'"><label style="flex:1;text-align:center;border:1px solid var(--line);border-radius:12px;padding:12px;cursor:pointer;font-weight:600">📷 صورة الهاتف<input type="file" accept="image/*" style="display:none" onchange="imgPick(this)"></label></div>'}
function imgPick(el){var f=el.files&&el.files[0];if(!f)return;var r=new FileReader();r.onload=function(){var im=new Image();im.onload=function(){var k=Math.min(1,320/Math.max(im.width,im.height)),c=document.createElement('canvas');c.width=Math.round(im.width*k);c.height=Math.round(im.height*k);c.getContext('2d').drawImage(im,0,0,c.width,c.height);imgTmp=c.toDataURL('image/jpeg',0.6);var p=$('imgp');p.src=imgTmp;p.style.visibility='visible'};im.src=r.result};r.readAsDataURL(f)}
var BR=['Samsung','Redmi','Poco','Xiaomi','Infinix','Tecno','Itel','Oppo','Realme','Huawei','Honor','Vivo','ZTE','iPhone','Nokia','Motorola'],devPre=null;
function brandOf(m,g){var t=(m+' '+(g||'')).toLowerCase().replace('infinx','infinix');return BR.find(function(x){return t.indexOf(x.toLowerCase())>-1})||'أخرى'}
function mdlOf(id){return db.mdl.find(function(x){return x.id===id})}
function mdlFind(n){var k=nz(n);return db.mdl.find(function(x){return nz(x.name)===k})}
function mdlAdd(n,c,p,q){var m={id:'m_'+nz(n).replace(/[^a-z0-9\u0600-\u06ff]/g,''),name:n,brand:brandOf(n),cost:c||0,price:p||0,qty:q||0};if(db.mdl.some(function(x){return x.id===m.id}))m.id+='_'+Date.now();db.mdl.push(m);return m}
function mdlStock(m){return (m.qty||0)+db.dev.filter(function(d){return d.mid===m.id&&d.st==='stock'}).length}
function mdlOfItem(i){return i.mid||(i.dv&&(db.dev.find(function(d){return d.id===i.dv})||{}).mid)}
function mdlSold(m){var n=0,rev=0,pr=0;db.tx.forEach(function(t){if(t.type!=='debt'||t.ret||!t.items)return;t.items.forEach(function(i){if(mdlOfItem(i)===m.id){n+=i.q;rev+=c2(i.q*i.p,t.cur);pr+=c2(i.q*(i.p-(i.c||0)),t.cur)}})});return {n:n,rev:rev,pr:pr}}
function mdlSeed(){
  var n=0;
  db.scr.forEach(function(r){r.models.forEach(function(m){if(!mdlFind(m)){mdlAdd(m,0,0,0).brand=brandOf(m,r.src?'':r.name);n++}})});
  db.dev.forEach(function(d){if(!d.mid){d.mid=(mdlFind(d.name)||mdlAdd(d.name,d.cost,d.price)).id}});
  if(n)save();return n;
}
function pDev(){
  if(!db.mdl.length&&(db.scr.length||db.dev.length))mdlSeed();

  mdlList();

function mdlList(){
  var q=nz(st.mq),L=db.mdl.map(function(m){return {m:m,s:mdlStock(m),x:mdlSold(m).n}}).filter(function(o){return (!q||nz(o.m.name).indexOf(q)>-1)&&(!st.mb||o.m.brand===st.mb)&&(!st.mo||o.s>0)});
  var so=st.ms||'n';L.sort(function(a,b){return so==='s'?b.s-a.s:so==='x'?b.x-a.x:a.m.name.localeCompare(b.m.name)});
  var tot=db.mdl.reduce(function(a,m){return a+mdlStock(m)},0),sold=db.mdl.reduce(function(a,m){return a+mdlSold(m).n},0);

  if(L.length>200)h+='<p class="ph" style="direction:rtl">يُعرض أول 200 نتيجة، استخدم البحث.</p>';
  $('ml').innerHTML=h;

}
/* ===== اختيار زبون برقم واتساب إلزامي + كليشة البيع ===== */
function custPick(p){return '<select id="'+p+'_c" onchange="custFill(\''+p+'\')"><option value="">زبون جديد: اكتب الاسم والرقم</option>'+db.cust.map(function(c){return '<option value="'+c.id+'">'+esc(c.name)+'</option>'}).join('')+'</select>'+inp(p+'_n','اسم الزبون الجديد')+inp(p+'_p','رقم واتساب الزبون (إلزامي)',null,'tel')}
function custFill(p){var c=db.cust.find(function(x){return x.id===$(p+'_c').value});$(p+'_n').style.display=c?'none':'';$(p+'_p').value=c?(c.phone||''):''}
function custResolve(p){
  var id=$(p+'_c').value,ph=gv(p+'_p'),c;
  if(!id&&!gv(p+'_n')){alert('اختر الزبون أو اكتب اسمه');$(p+'_n').focus();return ''}
  if(!ph){alert('رقم واتساب الزبون مطلوب لإرسال كليشة الشراء');$(p+'_p').focus();return ''}
  if(id){c=db.cust.find(function(x){return x.id===id});c.phone=ph;return id}
  c={id:'c'+Date.now(),name:gv(p+'_n'),phone:ph,lim:0};db.cust.push(c);return c.id;
}
function saleMsg(t){
  var s=db.set,c=db.cust.find(function(x){return x.id===t.cid})||{},pl=db.ins.find(function(p){return p.start===t.d&&p.cid===t.cid}),paid=t.paid||0;
  var L=(t.items||[]).map(function(i){return '• '+i.n+(i.q>1?' × '+i.q:'')+' — '+fmt(i.q*i.p,t.cur)}).join('\n');
  return '🧾 *'+(s.shop||'')+'*\nأهلاً بك '+(c.name||'')+' 🌹 شكراً لاختيارك لنا.\n\n*تفاصيل الشراء:*\n'+L+(t.disc?'\nخصم/استبدال: '+fmt(t.disc,t.cur):'')+'\n━━━━━━━━\n*السعر الإجمالي: '+fmt(t.amt,t.cur)+'*'+(paid?'\nالمبلغ الواصل: '+fmt(paid,t.cur):'')+'\nالمتبقي: '+fmt(Math.max(0,t.amt-paid),t.cur)+(pl?'\nالقسط الشهري: '+fmt(pl.mo,pl.cur)+' × '+pl.n+' شهر':'')+(t.wm?'\nالضمان حتى: '+dstr(wend(t)):'')+(t.due?'\nموعد التسديد: '+dstr(t.due):'')+'\nرقم الفاتورة: '+(t.no||'')+'\n\n'+(s.ft||'');
}

function sellModel(id){

function smT(){var k=$('m1k').value,t=(gn('m1q')||1)*gn('m1x'),r=Math.min(gn('m1r'),t);$('m1t').innerHTML='<span>الإجمالي '+fmt(t,k)+' • الواصل '+fmt(r,k)+'</span><b class="debt">المتبقي '+fmt(t-r,k)+'</b>'}
function doSellModel(id){
  var m=mdlOf(id),cid=custResolve('m1');if(!cid)return;
  var q=gn('m1q')||1,p=gn('m1x'),cur=$('m1k').value,amt=q*p,rec=Math.min(Math.max(gn('m1r'),0),amt),dd=$('m1d').value,now=Date.now();
  if(!(p>0))return alert('اكتب سعر البيع');
  if(q>(m.qty||0)&&!confirm('الكمية أكبر من المتوفر ('+(m.qty||0)+'). متابعة؟'))return;
  var t={id:'t'+now,cid:cid,type:'debt',cur:cur,amt:amt,items:[{n:m.name,q:q,p:p,c:m.cost||0,mid:m.id}],note:'',d:now,wm:Math.floor(gn('m1w')),paid:rec,no:db.seq=(db.seq||0)+1};
  if(dd)t.due=new Date(dd+'T23:59:59').getTime();
  db.tx.push(t);if(rec>0)db.tx.push({id:'t'+(now+1),cid:cid,type:'pay',cur:cur,amt:rec,note:'دفعة عند الشراء',d:now+1});
  m.qty=Math.max(0,(m.qty||0)-q);
  save();closeM();render();saleWa(t.id);openReceipt(t.id,true);
}
function pick(){var v=$('tp').value,p=v.indexOf('m:')===0?mdlOf(v.slice(2)):db.prod.find(function(x){return x.id===v});if(!p)return;$('ln').value=p.name;$('lp').value=p.price}

/* ===== الديون: كشف، تسديد، تحكم ===== */
function dtot(id){var d={IQD:0,USD:0},p={IQD:0,USD:0};db.tx.forEach(function(t){if(t.cid!==id||t.ret)return;var k=t.cur||'IQD';if(t.type==='debt')d[k]+=t.amt;else p[k]+=t.amt});return {d:d,p:p}}
function csum(o){var a=[];if(o.IQD)a.push(fmt(o.IQD));if(o.USD)a.push(fmt(o.USD,'USD'));return a.join(' + ')||fmt(0)}
function alloc(cid){
  var T=db.tx.filter(function(t){return t.cid===cid&&!t.ret}).sort(function(a,b){return a.d-b.d}),pool={IQD:0,USD:0},out=[];
  T.forEach(function(t){if(t.type==='pay')pool[t.cur||'IQD']+=t.amt});
  T.forEach(function(t){if(t.type!=='debt')return;var k=t.cur||'IQD',pd=Math.min(pool[k],t.amt);pool[k]-=pd;out.push({t:t,paid:pd,rest:t.amt-pd})});

function uniSum(){
  var gd=0,gp=0,late=0,now=new Date(),nm=mon(now.getTime());
  db.tx.forEach(function(t){if(t.ret)return;if(t.type==='debt')gd+=iq(t);else gp+=iq(t)});
  db.cust.forEach(function(c){if(odAmt(c.id)>0)late++});
  var S=db.tx.filter(function(t){return t.type==='debt'&&t.items&&!t.ret&&mon(t.d)===nm}),sm=function(a,f){return a.reduce(function(x,y){return x+f(y)},0)};
  return {cust:db.cust.length,debt:gd,paid:gp,rest:gd-gp,late:late,stock:sm(db.mdl,function(m){return mdlStock(m)}),sales:sm(S,iq),profit:sm(S,mg)+sm(db.rep.filter(function(r){return r.s===3&&r.done&&mon(r.done)===nm}),function(r){return (r.price||0)-(r.cost||0)}),exp:sm(db.exp.filter(function(e){return mon(e.d)===nm}),function(e){return c2(e.amt,e.cur)})};
}

function cashCust(){var c=gcust('c_cash');if(!c){c={id:'c_cash',name:'زبون نقدي',phone:'',lim:0};db.cust.push(c)}return c.id}
function qsFind(q){
  q=String(q||'').trim();if(!q)return [];var k=nz(q),R=[],ex=db.dev.filter(function(d){return d.st==='stock'&&d.imei===q}).concat([]);
  if(ex.length)return ex.map(function(d){return {n:d.name+' ('+d.imei+')',q:1,p:d.price,c:d.cost||0,dv:d.id,mid:d.mid,wm:d.wm||0}});
  var pb=db.prod.filter(function(p){return p.bc&&p.bc===q&&p.qty>0});if(pb.length)return pb.map(function(p){return {n:p.name,q:1,p:p.price,c:p.cost||0,pid:p.id}});
  db.dev.forEach(function(d){if(d.st==='stock'&&k.length>2&&nz(d.name).indexOf(k)>-1)R.push({n:d.name+' ('+d.imei+')',q:1,p:d.price,c:d.cost||0,dv:d.id,mid:d.mid,wm:d.wm||0})});
  db.prod.forEach(function(p){if(p.qty>0&&nz(p.name).indexOf(k)>-1)R.push({n:p.name,q:1,p:p.price,c:p.cost||0,pid:p.id})});
  db.mdl.forEach(function(m){if((m.qty||0)>0&&nz(m.name).indexOf(k)>-1)R.push({n:m.name,q:1,p:m.price||0,c:m.cost||0,mid:m.id})});
  return R;
}
function qsPush(it){var x=qs.cart.find(function(i){return (it.dv&&i.dv===it.dv)||(it.pid&&i.pid===it.pid)||(!it.dv&&!it.pid&&it.mid&&i.mid===it.mid&&!i.dv)});if(x){if(it.dv)return toast('الجهاز مضاف مسبقاً');x.q++}else qs.cart.push(Object.assign({},it));qsDraw()}
function qsAdd(q){var R=qsFind(q);if(!R.length)return toast('لا نتيجة لـ «'+q+'»');if(R.length===1||(R[0].dv&&nz(R[0].n).indexOf(nz(q))>-1&&String(q).length>8)){qsPush(R[0]);if($('qs_q'))$('qs_q').value='';return}modal('<h3>اختر</h3>'+R.slice(0,12).map(function(r,i){return '<div class="card c" onclick="qsPick('+i+')"><div class="row"><span>'+esc(r.n)+'</span><b>'+fmt(r.p)+'</b></div></div>'}).join('')+'<div class="btns"><button class="g" onclick="closeM()">إلغاء</button></div>');window.__qsR=R}

function qsDraw(){

function qsDone(){
  var C=qs.cart;if(!C.length)return toast('أضف جهازاً أو مادة أولاً');
  var cid=$('qs_cu').value,tot=C.reduce(function(a,i){return a+i.q*i.p},0),rec=$('qs_r').value===''?tot:Math.min(Math.max(gn('qs_r'),0),tot);
  if(rec<tot&&!cid)return toast('اختر زبوناً ليُسجَّل الباقي ديناً');
  if(!cid)cid=cashCust();
  for(var k=0;k<C.length;k++){var i=C[k];if(i.pid){var p=db.prod.find(function(x){return x.id===i.pid});if(p&&i.q>p.qty&&!confirm('«'+p.name+'»: الكمية أكبر من المتوفر ('+p.qty+'). متابعة؟'))return}if(i.mid&&!i.dv){var m=mdlOf(i.mid);if(m&&i.q>(m.qty||0)&&!confirm('«'+m.name+'»: الكمية أكبر من المتوفر ('+(m.qty||0)+'). متابعة؟'))return}}
  var now=Date.now(),t={id:'t'+now,cid:cid,type:'debt',cur:'IQD',amt:tot,items:C.map(function(i){return {n:i.n,q:i.q,p:i.p,c:i.c||0,pid:i.pid||'',mid:i.mid||'',dv:i.dv||''}}),note:'',d:now,paid:rec,form:'qs',no:db.seq=(db.seq||0)+1,wm:Math.max.apply(null,C.map(function(i){return i.wm||0}))};
  C.forEach(function(i){if(i.pid){var p=db.prod.find(function(x){return x.id===i.pid});if(p)p.qty=Math.max(0,p.qty-i.q)}else if(i.dv){var d=db.dev.find(function(x){return x.id===i.dv});if(d){d.st='sold';d.sd=now;d.cid=cid;d.tid=t.id}}else if(i.mid){var m=mdlOf(i.mid);if(m)m.qty=Math.max(0,(m.qty||0)-i.q)}});
  db.tx.push(t);if(rec>0)db.tx.push({id:'t'+(now+1),cid:cid,type:'pay',cur:'IQD',amt:rec,note:'بيع سريع',d:now+1});
  var pr=$('qs_pr').checked;save();qs.cart=[];toast('تم البيع ✓');if(pr)saleRec(t.id);else pQs();
}

/* --- مطالبات الضمان --- */
function wLook(imei){
  imei=String(imei||'').trim();if(!imei)return null;var now=Date.now(),best=null;
  db.tx.forEach(function(t){if(t.type!=='debt'||t.ret||!t.items||!t.wm)t.items&&0;if(t.type==='debt'&&!t.ret&&t.items&&t.wm)t.items.forEach(function(i){var d=i.dv&&db.dev.find(function(x){return x.id===i.dv});if(d&&d.imei===imei){var e=wend(t);best={src:'بيع',who:cn(t.cid),name:d.name,date:t.d,end:e.getTime(),ok:e.getTime()>now}}})});
  db.rep.forEach(function(r){if(r.imei===imei&&r.wm){var e=new Date(r.done||r.d);e.setMonth(e.getMonth()+r.wm);if(!best||e.getTime()>best.end)best={src:'صيانة',who:r.name,name:r.dev,date:r.done||r.d,end:e.getTime(),ok:e.getTime()>now}}});
  return best;
}
function pClm(){
  var nm=mon(Date.now()),M=db.clm.filter(function(c){return mon(c.d)===nm}),cost=M.reduce(function(a,c){return a+(c.cost||0)},0);
  $('app').innerHTML=hb()+'<h3>🛡 مطالبات الضمان</h3><div class="stats"><div class="card"><span>مطالبات هذا الشهر</span><b>'+M.length+'</b></div><div class="card"><span>كلفتها</span><b class="debt">'+fmt(cost)+'</b></div></div><div class="btns"><button onclick="clmForm()">＋ مطالبة جديدة</button></div>'+(db.clm.length?db.clm.slice().sort(function(a,b){return b.d-a.d}).map(function(c){return '<div class="card"><div class="row"><div><div class="nm">'+esc(c.dev||'')+' <span class="tag">'+esc(c.res)+'</span></div><div class="ph" style="direction:rtl">'+esc(c.who||'')+' • IMEI '+esc(c.imei||'—')+' • '+dstr(c.d)+'</div><div>'+esc(c.reason||'')+'</div></div><b class="debt">'+fmt(c.cost||0)+'</b></div></div>'}).join(''):'<div class="empty">لا مطالبات.</div>');
}
function clmForm(){modal('<h3>مطالبة ضمان</h3><div class="row" style="gap:6px"><input id="cm_i" placeholder="IMEI الجهاز" style="margin:0;flex:1" oninput="clmChk()"><button class="g" onclick="scanFor(\'cm_i\')">📷</button></div><div id="cm_w" class="ph" style="direction:rtl;min-height:20px;margin:6px 0"></div>'+inp('cm_d','الجهاز')+inp('cm_u','الزبون')+inp('cm_r','سبب المطالبة')+inp('cm_c','كلفة المعالجة علينا',null,'number')+'<select id="cm_s"><option>إصلاح</option><option>استبدال</option><option>مرفوض</option></select><label style="display:block;margin:6px 0"><input id="cm_e" type="checkbox" checked style="width:auto"> سجّل الكلفة كمصروف (ضمان)</label><div class="btns"><button onclick="clmSave()">حفظ</button><button class="g" onclick="closeM()">إلغاء</button></div>')}
function clmChk(){var w=wLook($('cm_i').value);$('cm_w').innerHTML=w?(w.ok?'✅ داخل الضمان':'❌ الضمان منتهي')+' — '+w.src+' لـ '+esc(w.who)+' بتاريخ '+dstr(w.date)+'، الضمان حتى '+dstr(w.end):'لا سجل ضمان لهذا الـ IMEI';if(w){if(!$('cm_d').value)$('cm_d').value=w.name;if(!$('cm_u').value)$('cm_u').value=w.who}}
function clmSave(){var d=gv('cm_d');if(!d)return toast('اكتب الجهاز');var w=wLook($('cm_i').value),c={id:'m'+Date.now(),d:Date.now(),imei:gv('cm_i'),dev:d,who:gv('cm_u'),reason:gv('cm_r'),cost:gn('cm_c'),res:$('cm_s').value,inw:w?w.ok:null};db.clm.push(c);if(c.cost>0&&c.res!=='مرفوض'&&$('cm_e').checked)db.exp.push({id:'e'+Date.now(),cat:'ضمان',cur:'IQD',amt:c.cost,note:d+' '+c.imei,d:Date.now()});save();closeM();render()}
/* --- عمولات الموظفين --- */
function cmData(off){
  var nm=mon(Date.now())-(off||0),R={},add=function(n,k,v){var o=R[n]||(R[n]={n:n,sales:0,sp:0,rep:0,rp:0});o[k]+=v};
  db.tx.forEach(function(t){if(t.type==='debt'&&t.items&&!t.ret&&mon(t.d)===nm){var u=t.byn||'—';add(u,'sales',iq(t));add(u,'sp',mg(t))}});
  db.rep.forEach(function(r){if(r.s===3&&r.done&&mon(r.done)===nm){var u=r.byn||'—';add(u,'rep',r.price||0);add(u,'rp',(r.price||0)-(r.cost||0))}});
  return Object.keys(R).map(function(k){return R[k]});
}
function pCom(){
  var off=st.co||0,cm=db.set.cm||{},b=db.set.cmb||'profit',L=cmData(off);
  $('app').innerHTML=hb()+'<h3>💼 عمولات الموظفين</h3><div class="tabs"><button class="'+(off?'g':'')+'" onclick="st.co=0;pCom()">هذا الشهر</button><button class="'+(off?'':'g')+'" onclick="st.co=1;pCom()">الشهر الماضي</button></div><select id="cm_b" onchange="cmSave()"><option value="profit"'+(b==='profit'?' selected':'')+'>العمولة من الربح</option><option value="sales"'+(b==='sales'?' selected':'')+'>العمولة من المبيعات</option></select><p class="ph" style="direction:rtl">تُنسب العملية إلى من أنشأها. الأرقام بالدينار.</p>'+(L.length?L.map(function(o,i){var c=cm[o.n]||{s:0,r:0},bs=b==='profit'?o.sp:o.sales,br=b==='profit'?o.rp:o.rep,com=bs*c.s/100+br*c.r/100;return '<div class="card"><div class="row"><b>'+esc(o.n)+'</b><b class="pay">'+fmt(com)+'</b></div><div class="ph" style="direction:rtl">مبيعات '+fmt(o.sales)+' (ربح '+fmt(o.sp)+') • صيانة '+fmt(o.rep)+' (ربح '+fmt(o.rp)+')</div><div class="row" style="gap:6px"><input class="cm_s" data-n="'+esc(o.n)+'" type="number" placeholder="% للمبيعات" value="'+(c.s||'')+'" style="margin:0"><input class="cm_r" data-n="'+esc(o.n)+'" type="number" placeholder="% للصيانة" value="'+(c.r||'')+'" style="margin:0"></div></div>'}).join('')+'<div class="btns"><button onclick="cmSave()">حفظ النسب</button></div>':'<div class="empty">لا عمليات هذا الشهر.</div>');
}
function cmSave(){var cm=db.set.cm||{};[].forEach.call(document.querySelectorAll('.cm_s'),function(e){var n=e.getAttribute('data-n');cm[n]=cm[n]||{};cm[n].s=+e.value||0});[].forEach.call(document.querySelectorAll('.cm_r'),function(e){var n=e.getAttribute('data-n');cm[n]=cm[n]||{};cm[n].r=+e.value||0});db.set.cm=cm;db.set.cmb=$('cm_b').value;save();pCom()}
/* --- قطع الصيانة من المخزون --- */
function rpSel(){var p=db.prod.find(function(x){return x.id===$('rp_sel').value});if(p){$('pn_').value=p.name;$('pp_').value=p.price}}
function rpAdd(){var n=gv('pn_');if(!n)return $('pn_').focus();var pid=$('rp_sel')?$('rp_sel').value:'',p=pid&&db.prod.find(function(x){return x.id===pid});rParts.push({n:n,p:gn('pp_'),pid:pid||'',c:(p&&p.cost)||0});$('pn_').value='';$('pp_').value='';if($('rp_sel'))$('rp_sel').value='';rpTot()}
(function(){var _rs=repSave;repSave=function(id){
  var old=id?((db.rep.find(function(x){return x.id===id})||{}).parts||[]).map(function(p){return p.pid||''}):[],n0=db.rep.length;_rs(id);
  if($('rn'))return;var r=id?db.rep.find(function(x){return x.id===id}):db.rep[db.rep.length-1];if(!r||(!id&&db.rep.length===n0))return;
  old.forEach(function(pid){var p=pid&&db.prod.find(function(x){return x.id===pid});if(p)p.qty++});
  (r.parts||[]).forEach(function(x){var p=x.pid&&db.prod.find(function(q){return q.id===x.pid});if(p)p.qty=Math.max(0,p.qty-1)});
  if(!r.cost)r.cost=(r.parts||[]).reduce(function(a,x){return a+(x.c||0)},0);save();
}})();
function repDel(id){if(!confirm('حذف الطلب؟ ستعود القطع المربوطة بالمخزون.'))return;var r=db.rep.find(function(x){return x.id===id});(r.parts||[]).forEach(function(x){var p=x.pid&&db.prod.find(function(q){return q.id===x.pid});if(p)p.qty++});db.rep=db.rep.filter(function(x){return x.id!==id});save();closeM();render()}
/* --- بصمة الإصبع (WebAuthn) --- */
function b64u(b){var s='';new Uint8Array(b).forEach(function(c){s+=String.fromCharCode(c)});return btoa(s).replace(/\+/g,'-').replace(/\//g,'_').replace(/=+$/,'')}
function unb64u(s){s=s.replace(/-/g,'+').replace(/_/g,'/');var bin=atob(s),u=new Uint8Array(bin.length);for(var i=0;i<bin.length;i++)u[i]=bin.charCodeAt(i);return u}
function bioOk(){return !!(window.PublicKeyCredential&&navigator.credentials&&navigator.credentials.create)}
async function bioReg(){
  if(!getPin())return toast('فعّل رمز القفل 🔒 أولاً');if(!bioOk())return toast('هذا المتصفح لا يدعم البصمة');
  try{var c=await navigator.credentials.create({publicKey:{challenge:crypto.getRandomValues(new Uint8Array(32)),rp:{name:'حسن صدام',id:location.hostname},user:{id:crypto.getRandomValues(new Uint8Array(16)),name:'user',displayName:ME.name||'مستخدم'},pubKeyCredParams:[{type:'public-key',alg:-7},{type:'public-key',alg:-257}],authenticatorSelection:{authenticatorAttachment:'platform',userVerification:'required'},timeout:60000}});localStorage.setItem('hs_bio',b64u(c.rawId));toast('تم تفعيل البصمة ✓');lgInit()}catch(e){toast('تعذّر تفعيل البصمة: '+(e&&e.name||''))}
}
function bioOff(){localStorage.removeItem('hs_bio');toast('أُوقفت البصمة');lgInit()}
async function bioAuth(){
  var id=localStorage.getItem('hs_bio');if(!id||!bioOk())return;
  try{await navigator.credentials.get({publicKey:{challenge:crypto.getRandomValues(new Uint8Array(32)),rpId:location.hostname,allowCredentials:[{type:'public-key',id:unb64u(id)}],userVerification:'required',timeout:60000}});lgOpen()}catch(e){toast('لم يتم التحقق بالبصمة')}
}
(function(){var _li=lgInit;lgInit=function(){_li();var b=$('lbio');if(b)b.style.display=(localStorage.getItem('hs_bio')&&getPin()&&bioOk())?'':'none'}})();

/* ===== رابط كشف الحساب للزبون (Firebase) ===== */
function stkToken(){return Array.from(crypto.getRandomValues(new Uint8Array(12))).map(function(b){return b.toString(36).padStart(2,'0')}).join('').slice(0,18)}
function stkUrl(c){return c.stk?location.origin+location.pathname.replace(/[^/]*$/,'')+'statement.html?t='+c.stk:''}
function stkPack(c){
  var A=alloc(c.id),t=dtot(c.id);
  return {shopId:SHOP.id,shop:db.set.shop||'',tel:db.set.tel||'',name:c.name,
    rows:A.rows.slice(-40).map(function(x){return {d:x.t.d,n:(x.t.items&&x.t.items[0]?x.t.items[0].n:(x.t.note||'دين')),a:x.t.amt,p:x.paid,r:x.rest,k:x.t.cur||'IQD',u:x.t.due||0}}),
    pays:db.tx.filter(function(x){return x.cid===c.id&&x.type==='pay'&&!x.ret}).sort(function(a,b){return b.d-a.d}).slice(0,20).map(function(x){return {d:x.d,a:x.amt,k:x.cur||'IQD'}}),
    tot:{d:csum(t.d),p:csum(t.p),r:balS(c.id)},pr:c.pr&&c.pr.d?c.pr.d:0};
}
var __stkH={},__stkT=null;
async function stkSync(c){if(!c||!c.stk||!SHOP)return;try{var p=stkPack(c),h=JSON.stringify(p);if(__stkH[c.stk]===h)return;__stkH[c.stk]=h;p.upd=Date.now();await fsd().collection('stmts').doc(c.stk).set(p)}catch(e){delete __stkH[c.stk]}}
function stkSoon(){clearTimeout(__stkT);__stkT=setTimeout(function(){db.cust.forEach(function(c){if(c.stk)stkSync(c)})},2500)}
function stkShare(id){
  var c=gcust(id);if(!c.stk){c.stk=stkToken();save()}stkSync(c);
  var u=stkUrl(c),txt='📄 كشف حسابك لدى '+(db.set.shop||'المحل')+' (يتحدّث تلقائياً):\n'+u;
  modal('<h3>🔗 رابط كشف الحساب</h3><p class="ph" style="direction:rtl">يرى الزبون ما عليه وتسديداته وفواتيره فقط، ويتحدّث تلقائياً. الرابط سرّي لمن يملكه فلا ترسله إلا للزبون نفسه.</p><input id="sk_u" readonly value="'+esc(u)+'" style="direction:ltr"><div class="btns"><button onclick="$(\'sk_u\').select();document.execCommand(\'copy\');toast(\'نُسخ الرابط\')">نسخ</button><button class="wa" onclick="go(\'wa\',decodeURIComponent(\''+encodeURIComponent(txt)+'\'),\''+esc(c.phone||'')+'\')">إرسال للزبون</button></div><div class="btns"><button class="g" style="color:var(--debt)" onclick="stkOff(\''+id+'\')">إلغاء الرابط</button><button class="g" onclick="closeM()">إغلاق</button></div>');
}
function stkOff(id){var c=gcust(id);if(!confirm('سيتوقف الرابط عن العمل. متابعة؟'))return;try{fsd().collection('stmts').doc(c.stk).delete()}catch(e){}delete __stkH[c.stk];delete c.stk;save();closeM();render()}
(function(){var _sv=save;save=function(){_sv();stkSoon()}})();

auditReset();
render();
</script>
